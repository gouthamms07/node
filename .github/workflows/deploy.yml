name: Node CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 188244334939.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: docker build -t node-app .

      - name: Tag image
        run: docker tag node-app:latest 188244334939.dkr.ecr.ap-south-1.amazonaws.com/node-app:latest

      - name: Push image
        run: docker push 188244334939.dkr.ecr.ap-south-1.amazonaws.com/node-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: node
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull 188244334939.dkr.ecr.ap-south-1.amazonaws.com/node-app:latest
            docker stop node_app || true
            docker rm node_app || true
            docker run -d -p 5001:5000 --name node_app 188244334939.dkr.ecr.ap-south-1.amazonaws.com/node-app:latest
